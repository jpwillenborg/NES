name: NES CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore "NES Box Art.csproj"
      - run: dotnet build "NES Box Art.csproj" --no-restore --configuration Release
      - run: dotnet list "NES Box Art.csproj" package --vulnerable --include-transitive

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nes-client/package-lock.json
      - run: npm ci
        working-directory: nes-client
      - run: npm run build
        working-directory: nes-client
