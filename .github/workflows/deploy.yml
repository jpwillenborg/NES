name: Build and Deploy NES Frontend

on:
  push:
    branches: [ main ]
    # Only trigger this workflow if files inside the frontend folder change
    paths:
      - 'nes-client/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        # Tells the caching mechanism to look inside the client subfolder
        cache-dependency-path: ./nes-client/package-lock.json

    # Clean install and build production files inside the client folder
    - name: Install and Build Frontend
      working-directory: ./nes-client
      run: |
        npm ci
        npm run build

    # Deploy the dist folder generated inside the client folder
    - name: FTP Deploy to Bluehost
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.FTP_PASSWORD }} 
        port: 21
        protocol: ftps
        local-dir: ./nes-client/dist/ # Pointing to the nested dist directory
        server-dir: ./memory.jpwillenborg.com/
